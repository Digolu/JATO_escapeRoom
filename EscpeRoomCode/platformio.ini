; ## esp32 normal: hospeda as paginas (WebServer + LittleFS), liga-se como
; ## estacao a rede JATO, e tem agora o TECLADO e o SERVO ligados localmente.
; ## Compila apenas o codigo em src/esp32dev/
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.filesystem = littlefs
upload_protocol = esptool
monitor_speed = 115200
build_flags =
    -fpermissive
build_src_filter = +<esp32dev/>
lib_deps =
    https://github.com/smart-tech-benin/ZRX543.git
    madhephaestus/ESP32Servo @ ^3.2.0

; ## esp c6 mini: liga-se como estacao a rede JATO e controla o RELE (CW-019),
; ## enviando o estado para o esp32dev.
; ## Compila apenas o codigo em src/c6/
; [env:esp32-c6-devkitm-1]
; platform = espressif32
; board = esp32-c6-devkitm-1
; framework = arduino
; upload_protocol = esptool
; monitor_speed = 115200
; build_src_filter = +<c6/>