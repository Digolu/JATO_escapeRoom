<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sala de Enigmas</title>

<style>
  :root {
    --bg: #14171c;
    --card-bg: #1e232b;
    --card-border: #2b323d;
    --accent: #5eead4;
    --accent-dim: #2f6b62;
    --pendente: #8a90a0;
    --resolvido: #5eead4;
    --text: #e7e9ee;
    --danger: #f87171;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 40px 20px;
    background: radial-gradient(circle at top, #1b2028, #0f1216 70%);
    color: var(--text);
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    min-height: 100vh;
  }

  header {
    text-align: center;
    margin-bottom: 24px;
  }

  header h1 {
    font-size: 1.9em;
    margin: 0 0 6px 0;
    letter-spacing: 0.5px;
  }

  header p {
    color: #8a90a0;
    margin: 0;
    font-size: 0.95em;
  }

  a.link-equipas {
    display: block;
    text-align: center;
    color: var(--accent);
    text-decoration: none;
    font-size: 0.9em;
    margin-bottom: 24px;
  }

  a.link-equipas:hover {
    text-decoration: underline;
  }

  #painelEquipa {
    max-width: 560px;
    margin: 0 auto 20px auto;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 22px;
    text-align: center;
  }

  #semEquipa {
    color: #8a90a0;
    font-size: 1em;
  }

  #painelAtivo {
    display: none;
  }

  #painelAtivo .nome-equipa {
    font-size: 1.35em;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 6px;
  }

  #painelAtivo .detalhes {
    color: #8a90a0;
    font-size: 0.9em;
    margin-bottom: 10px;
  }

  #painelAtivo .timer {
    font-size: 2.2em;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  #painelRele {
    max-width: 560px;
    margin: 0 auto 36px auto;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 22px;
    text-align: center;
  }

  #painelRele .rele-titulo {
    font-size: 0.85em;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #8a90a0;
    margin-bottom: 14px;
  }

  .rele-estado {
    display: inline-block;
    margin-bottom: 14px;
    font-size: 0.85em;
    padding: 4px 12px;
    border-radius: 20px;
    background: rgba(248, 113, 113, 0.12);
    color: var(--danger);
  }

  .rele-estado.ligado {
    background: rgba(94, 234, 212, 0.12);
    color: var(--accent);
  }

  .rele-btn {
    display: block;
    margin: 0 auto;
    padding: 12px 32px;
    font-size: 1em;
    font-weight: 700;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    background: var(--accent);
    color: #0f1216;
    transition: background 0.2s ease, transform 0.1s ease;
  }

  .rele-btn:active {
    transform: scale(0.97);
  }

  .rele-btn.ligado {
    background: var(--danger);
    color: #1b1010;
  }

  .rele-btn:disabled {
    opacity: 0.6;
    cursor: default;
  }

  #enigmas {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 20px;
    max-width: 1000px;
    margin: 0 auto;
  }

  .enigma-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 22px;
    position: relative;
    overflow: hidden;
    transition: border-color 0.3s ease, transform 0.2s ease;
  }

  .enigma-card.resolvido {
    border-color: var(--accent-dim);
  }

  .enigma-card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: var(--pendente);
    transition: background 0.3s ease;
  }

  .enigma-card.resolvido::before {
    background: var(--accent);
  }

  .enigma-titulo {
    font-size: 0.85em;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #8a90a0;
    margin-bottom: 10px;
  }

  .enigma-valor {
    font-size: 1.7em;
    font-weight: 700;
    word-break: break-word;
    color: var(--pendente);
    transition: color 0.3s ease;
  }

  .enigma-card.resolvido .enigma-valor {
    color: var(--resolvido);
  }

  .status-tag,
  .online-tag {
    display: inline-block;
    margin-top: 12px;
    margin-right: 6px;
    font-size: 0.75em;
    padding: 3px 10px;
    border-radius: 20px;
  }

  .status-tag {
    background: #2b323d;
    color: #8a90a0;
  }

  .enigma-card.resolvido .status-tag {
    background: rgba(94, 234, 212, 0.12);
    color: var(--accent);
  }

  .online-tag.online {
    background: rgba(94, 234, 212, 0.12);
    color: var(--accent);
  }

  .online-tag.offline {
    background: rgba(248, 113, 113, 0.12);
    color: var(--danger);
  }

  .info-tag {
    display: block;
    margin-top: 8px;
    font-size: 0.8em;
    color: #6b7180;
  }

  #erro {
    text-align: center;
    color: var(--danger);
    margin-top: 30px;
    display: none;
  }
</style>
</head>

<body>

<header>
  <h1>Sala de Enigmas</h1>
  <p>Códigos recebidos em tempo real</p>
</header>

<a class="link-equipas" href="/equipas">Gerir equipas &rarr;</a>

<div id="painelEquipa">
  <div id="semEquipa">
    Nenhuma equipa em progresso.
  </div>

  <div id="painelAtivo">
    <div class="nome-equipa" id="nomeEquipaAtiva"></div>
    <div class="detalhes" id="detalhesEquipaAtiva"></div>
    <div class="timer" id="timerAtivo">00:00:00</div>
  </div>
</div>

<div id="painelRele">
  <div class="rele-titulo">Relé</div>
  <div class="rele-estado" id="releEstado">Desligado</div>
  <button class="rele-btn" id="btnRele">Explodir</button>
</div>

<div id="enigmas"></div>

<p id="erro">Erro de ligação ao servidor...</p>

<script>
  const container = document.getElementById('enigmas');
  const erroEl = document.getElementById('erro');

  const semEquipaEl = document.getElementById('semEquipa');
  const painelAtivo = document.getElementById('painelAtivo');
  const nomeEquipaAtivaEl = document.getElementById('nomeEquipaAtiva');
  const detalhesEquipaAtivaEl = document.getElementById('detalhesEquipaAtiva');
  const timerAtivoEl = document.getElementById('timerAtivo');

  const btnRele = document.getElementById('btnRele');
  const releEstadoEl = document.getElementById('releEstado');

  let cardsCriados = false;
  let releLigado = false;
  let releAguardandoResposta = false;

  function chaveParaNumero(chave) {
    return parseInt(chave.replace('cod', ''), 10);
  }

  function formatarTempoTotal(segundos) {
    if (segundos === undefined || segundos === null || segundos < 0) {
      return '--:--:--';
    }

    segundos = Number(segundos);

    const h = Math.floor(segundos / 3600);
    const m = Math.floor((segundos % 3600) / 60);
    const s = segundos % 60;

    return String(h).padStart(2, '0') + ':' +
           String(m).padStart(2, '0') + ':' +
           String(s).padStart(2, '0');
  }

  function formatarDataHora(valor) {
    if (!valor) {
      return '';
    }

    return String(valor).replace('T', ' ');
  }

  function criarCards(dados) {
    const chaves = Object.keys(dados)
      .filter((k) => k.startsWith('cod'))
      .sort((a, b) => chaveParaNumero(a) - chaveParaNumero(b));

    container.innerHTML = '';

    chaves.forEach((chave) => {
      const numero = chaveParaNumero(chave);

      const card = document.createElement('div');
      card.className = 'enigma-card';
      card.id = 'card-' + chave;

      card.innerHTML = `
        <div class="enigma-titulo">Enigma ${numero}</div>
        <div class="enigma-valor" id="valor-${chave}">Por descobrir</div>
        <div class="status-tag" id="status-${chave}">A aguardar</div>
        <div class="online-tag offline" id="online-${chave}">Offline</div>
        <div class="info-tag" id="tentativas-${chave}">Tentativas erradas: 0</div>
        <div class="info-tag" id="tempo-${chave}">Tempo do enigma: --:--:--</div>
      `;

      container.appendChild(card);
    });

    cardsCriados = true;
  }

  function atualizarCards(dados) {
    Object.keys(dados).forEach((chave) => {
      if (!chave.startsWith('cod')) {
        return;
      }

      const estado = dados[chave];

      const resolvido = estado.resolvido === true;
      const tentativas = estado.tentativas || 0;
      const atual = estado.atual || '';
      const online = estado.online === true;
      const tempoEnigmaSeg = estado.tempoEnigmaSeg;

      const card = document.getElementById('card-' + chave);
      const valorEl = document.getElementById('valor-' + chave);
      const statusEl = document.getElementById('status-' + chave);
      const onlineEl = document.getElementById('online-' + chave);
      const tentativasEl = document.getElementById('tentativas-' + chave);
      const tempoEl = document.getElementById('tempo-' + chave);

      if (!card || !valorEl || !statusEl || !onlineEl || !tentativasEl || !tempoEl) {
        return;
      }

      if (resolvido) {
        valorEl.innerText = atual && atual.length > 0 ? atual : 'Resolvido';
      } else if (atual.length > 0) {
        valorEl.innerText = atual;
      } else {
        valorEl.innerText = 'Por descobrir';
      }

      statusEl.innerText = resolvido ? 'Resolvido' : 'A aguardar';

      onlineEl.innerText = online ? 'Online' : 'Offline';
      onlineEl.className = 'online-tag ' + (online ? 'online' : 'offline');

      tentativasEl.innerText = 'Tentativas erradas: ' + tentativas;

      if (resolvido) {
        tempoEl.innerText = 'Tempo do enigma: ' + formatarTempoTotal(tempoEnigmaSeg);
      } else {
        tempoEl.innerText = 'Tempo do enigma: --:--:--';
      }

      card.classList.toggle('resolvido', resolvido);
    });
  }

  function atualizarPainelEquipa(dados) {
    const emProgresso = dados.emProgresso === true;

    if (emProgresso) {
      semEquipaEl.style.display = 'none';
      painelAtivo.style.display = 'block';

      nomeEquipaAtivaEl.innerText = dados.equipaAtual || '';

      const membros = dados.membrosAtual || 0;
      const dataHora = formatarDataHora(dados.dataHoraAtual || '');

      if (dataHora) {
        detalhesEquipaAtivaEl.innerText = membros + ' membros · ' + dataHora;
      } else {
        detalhesEquipaAtivaEl.innerText = membros + ' membros';
      }

      timerAtivoEl.innerText = dados.tempoDecorrido || '00:00:00';
    } else {
      semEquipaEl.style.display = 'block';
      painelAtivo.style.display = 'none';
      nomeEquipaAtivaEl.innerText = '';
      detalhesEquipaAtivaEl.innerText = '';
      timerAtivoEl.innerText = '00:00:00';
    }
  }

  function atualizarPainelRele(dados) {
    // Enquanto aguardamos a resposta do nosso próprio clique, não
    // sobrepomos o estado local com o polling (evita "piscar" o botão).
    if (releAguardandoResposta) {
      return;
    }

    releLigado = dados.rele === true;

    releEstadoEl.innerText = releLigado ? 'Ligado' : 'Desligado';
    releEstadoEl.classList.toggle('ligado', releLigado);

    btnRele.innerText = releLigado ? 'DesExplodir' : 'Explodir';
    btnRele.classList.toggle('ligado', releLigado);
  }

  async function atualizar() {
    try {
      const res = await fetch('/valores');

      if (!res.ok) {
        throw new Error('Erro ao obter valores');
      }

      const dados = await res.json();

      if (!cardsCriados) {
        criarCards(dados);
      }

      atualizarCards(dados);
      atualizarPainelEquipa(dados);
      atualizarPainelRele(dados);

      erroEl.style.display = 'none';
    } catch (e) {
      erroEl.style.display = 'block';
    }
  }

  btnRele.addEventListener('click', async () => {
    releAguardandoResposta = true;
    btnRele.disabled = true;

    try {
      const res = await fetch('/rele/toggle');

      if (!res.ok) {
        throw new Error('Erro ao comutar o rele');
      }

      const dados = await res.json();

      releLigado = dados.rele === true;

      releEstadoEl.innerText = releLigado ? 'Ligado' : 'Desligado';
      releEstadoEl.classList.toggle('ligado', releLigado);

      btnRele.innerText = releLigado ? 'DesExplodir' : 'Explodir';
      btnRele.classList.toggle('ligado', releLigado);
    } catch (e) {
      erroEl.style.display = 'block';
    } finally {
      btnRele.disabled = false;
      releAguardandoResposta = false;
    }
  });

  setInterval(atualizar, 300);
  atualizar();
</script>

</body>
</html>
